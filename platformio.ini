; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nicla_sense_me]
platform = nordicnrf52
board = nicla_sense_me
framework = arduino
src_filter = +<Subf_Nicla_sense_me/> -<Subf_Portenta_H7/>
monitor_speed = 115200
lib_deps = 
	arduino-libraries/Arduino_BHY2Host@^1.0.9
	arduino-libraries/ArduinoBLE@^1.4.1
	adafruit/Adafruit GFX Library@^1.12.1
	gilesp1729/FontCollection@^0.9.0
	adafruit/Adafruit ILI9341@^1.6.2
	https://github.com/arduino-libraries/Arduino_BHY2.git

[env:portenta_h7_m7]
board = portenta_h7_m7
platform = ststm32
monitor_speed = 115200
src_filter =
	+<Subf_Portenta_H7/>
	-<Subf_Nicla_sense_me/>
	
framework = arduino
lib_deps =	https://github.com/arduino-libraries/Arduino_BHY2.git
